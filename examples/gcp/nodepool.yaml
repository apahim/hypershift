apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: example-gcp-workers
  namespace: clusters
spec:
  # Reference to the HostedCluster
  clusterName: example-gcp-cluster

  # Number of worker nodes
  replicas: 3

  # GCP Platform Configuration for Worker Nodes
  platform:
    type: GCP
    gcp:
      # Instance type for worker nodes
      instanceType: n1-standard-4

      # Boot image configuration
      imageFamily: ubuntu-2004-lts
      # Alternatively, specify exact image:
      # image: projects/ubuntu-os-cloud/global/images/ubuntu-2004-focal-v20231213

      # Root disk configuration
      rootDeviceSize: 50  # GB
      rootDeviceType: pd-standard  # pd-standard, pd-ssd, pd-balanced

      # Optional: Additional disks
      additionalDisks:
      - deviceType: pd-ssd
        size: 100  # GB

      # Optional: Network configuration
      # subnet: "my-worker-subnet"
      # publicIP: false

      # Optional: Instance labels
      additionalLabels:
        environment: production
        team: platform

      # Optional: Service account for Workload Identity
      serviceAccounts:
        email: "worker-nodes@my-gcp-project.iam.gserviceaccount.com"
        scopes:
        - "https://www.googleapis.com/auth/cloud-platform"

  # OpenShift Release
  release:
    image: quay.io/openshift-release-dev/ocp-release:4.16.0-x86_64

  # Node Management
  management:
    autoRepair: true
    upgradeType: Replace