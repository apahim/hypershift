apiVersion: apiextensions.k8s.io/v1
name: "NodePool GCP service account validation"
crdName: nodepools.hypershift.openshift.io
featureGates:
  - GCPPlatform
version: v1beta1
tests:
  onCreate:
  - name: When the default Compute worker account is explicit it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: Replace
        release:
          image: quay.io/openshift-release-dev/ocp-release:5.0.2-x86_64
        replicas: 1
        platform:
          type: GCP
          gcp:
            machineType: n2-standard-4
            zone: northamerica-northeast2-a
            subnet: workers-subnet
            serviceAccount:
              email: 35809355916-compute@developer.gserviceaccount.com
  - name: When a custom worker account is explicit it should still pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: Replace
        release:
          image: quay.io/openshift-release-dev/ocp-release:5.0.2-x86_64
        replicas: 1
        platform:
          type: GCP
          gcp:
            machineType: n2-standard-4
            zone: northamerica-northeast2-a
            subnet: workers-subnet
            serviceAccount:
              email: worker@my-project-123.iam.gserviceaccount.com
  - name: When a developer-domain email is not a numeric default Compute account it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: Replace
        release:
          image: quay.io/openshift-release-dev/ocp-release:5.0.2-x86_64
        replicas: 1
        platform:
          type: GCP
          gcp:
            machineType: n2-standard-4
            zone: northamerica-northeast2-a
            subnet: workers-subnet
            serviceAccount:
              email: worker-compute@developer.gserviceaccount.com
    expectedError: "email must be a valid custom GCP service account email or a numeric default Compute service account email"
  - name: When the default Compute project number has a leading zero it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: Replace
        release:
          image: quay.io/openshift-release-dev/ocp-release:5.0.2-x86_64
        replicas: 1
        platform:
          type: GCP
          gcp:
            machineType: n2-standard-4
            zone: northamerica-northeast2-a
            subnet: workers-subnet
            serviceAccount:
              email: 035809355916-compute@developer.gserviceaccount.com
    expectedError: "email must be a valid custom GCP service account email or a numeric default Compute service account email"
  - name: When the default Compute domain has an additional suffix it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: NodePool
      spec:
        arch: amd64
        clusterName: some-cluster
        management:
          autoRepair: false
          upgradeType: Replace
        release:
          image: quay.io/openshift-release-dev/ocp-release:5.0.2-x86_64
        replicas: 1
        platform:
          type: GCP
          gcp:
            machineType: n2-standard-4
            zone: northamerica-northeast2-a
            subnet: workers-subnet
            serviceAccount:
              email: 35809355916-compute@developer.gserviceaccount.com.invalid
    expectedError: "email must be a valid custom GCP service account email or a numeric default Compute service account email"
